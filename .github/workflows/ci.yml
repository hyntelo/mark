name: continuous-integration

on:
  push:
    branches:
    - master
    tags:
    - '*'
  pull_request:
    branches:
    - master

env:
  GO_VERSION: "1.27.0"

# Least privilege: nothing here writes anything anywhere. The release is
# goreleaser's job, in its own workflow, and no image is published at all --
# the Dockerfiles are built by hand when somebody wants a container.
permissions:
  contents: read

jobs:
  # Runs Golangci-lint on the source code
  ci-go-lint:
    name: ci-go-lint
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
      id: go

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9

  # Runs markdown-lint on the markdown files
  ci-markdown-lint:
    name: ci-markdown-lint
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7
    - name: markdownlint-cli2-action
      uses: DavidAnson/markdownlint-cli2-action@v24.2.0

  # Executes Unit Tests
  ci-unit-tests:
    name: ci-unit-tests
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
      id: go

    # So that the tests draw with both engines rather than skipping the one
    # nothing on the runner provides. The checksum is the release's own.
    - name: Install merman
      run: |
        set -eux
        # The version mark requires, read from the file the binary embeds, so
        # that the runner cannot test against a merman the code would refuse.
        MERMAN_VERSION="$(cat mermaid/merman-version.txt)"
        base="https://github.com/Latias94/merman/releases/download/v${MERMAN_VERSION}"
        archive="merman-cli-x86_64-unknown-linux-gnu.tar.xz"
        curl -fsSL -o "$archive" "$base/$archive"
        curl -fsSL -o "$archive.sha256" "$base/$archive.sha256"
        sha256sum -c "$archive.sha256"
        tar -xJf "$archive"
        sudo install -m 0755 merman-cli-x86_64-unknown-linux-gnu/merman-cli /usr/local/bin/merman-cli
        merman-cli --version

    - name: Run unit tests
      run: |
        make test

  # Builds mark binary
  ci-build:
    name: ci-build
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
      id: go

    - name: Build mark
      run: |
        make build
