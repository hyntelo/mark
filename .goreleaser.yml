version: 2
before:
  hooks:
    - go mod download
builds:
- main: ./cmd/mark
  env:
  - CGO_ENABLED=0
  # -trimpath rather than a gcflags expression over $GOPATH: the same thing,
  # without the release depending on an environment variable the workflow has to
  # remember to set.
  flags:
  - -trimpath
  goos:
  - darwin
  - linux
  - windows
  goarch:
  - amd64
  - arm64
archives:
- name_template: >-
    {{ .ProjectName }}_
    {{- title .Os }}_
    {{- if eq .Arch "amd64" }}x86_64
    {{- else if eq .Arch "386" }}i386
    {{- else }}{{ .Arch }}{{ end }}
  formats: [tar.gz]
  # Windows has no tar, so a .tar.gz there is an archive a good many people
  # cannot open with what their machine came with.
  format_overrides:
  - goos: windows
    formats: [zip]
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'

release:
  footer: |
    ## Renderers

    The binary draws no diagrams by itself: it runs something else, found on the
    `PATH`, and this archive contains only `mark`.

    | Feature | Default | Alternative |
    |---|---|---|
    | `mermaid` | Chrome (`--mermaid-engine=chrome`) | [merman-cli](https://github.com/Latias94/merman), with `MARK_MERMAID_ENGINE=merman` |
    | `d2` | Chrome (`--d2-engine=chrome`) | [resvg](https://github.com/linebender/resvg), with `MARK_D2_ENGINE=resvg` |
    | `math` | Chrome | none |

    Publishing documents with no diagrams in them needs nothing installed.
